<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07070a" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Portfolio Under Maintenance</title>
  <style>
    :root {
      --bg: #07070a;
      --panel: rgba(18, 18, 24, 0.72);
      --text: #f5f5f7;
      --muted: #9a9aa4;
      --accent: #b9ff66;
      --accent-2: #69e8ff;
      --line: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 15%, rgba(105, 232, 255, 0.12), transparent 28%),
        radial-gradient(circle at 82% 80%, rgba(185, 255, 102, 0.10), transparent 30%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black 15%, transparent 75%);
    }

    .orb {
      position: fixed;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .13;
      pointer-events: none;
      animation: drift 10s ease-in-out infinite alternate;
    }

    .orb.one { background: var(--accent); top: -150px; right: -100px; }
    .orb.two { background: var(--accent-2); bottom: -160px; left: -110px; animation-delay: -4s; }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(92vw, 760px);
      padding: 52px 32px 40px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.018));
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
    }

    .animation {
      position: relative;
      width: 210px;
      height: 150px;
      margin: 0 auto 26px;
    }

    .monitor {
      position: absolute;
      left: 50%;
      top: 14px;
      width: 150px;
      height: 96px;
      transform: translateX(-50%);
      border: 2px solid rgba(255,255,255,.68);
      border-radius: 14px;
      background: #0d0d12;
      box-shadow: 0 0 0 1px rgba(255,255,255,.05), 0 0 38px rgba(105,232,255,.08);
      overflow: hidden;
    }

    .screen {
      position: absolute;
      inset: 9px;
      border-radius: 7px;
      overflow: hidden;
      background:
        linear-gradient(rgba(105,232,255,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(185,255,102,.05) 1px, transparent 1px),
        #08080b;
      background-size: 16px 16px;
    }

    .code {
      position: absolute;
      left: 18px;
      top: 18px;
      display: grid;
      gap: 8px;
      width: 92px;
    }

    .line {
      height: 5px;
      border-radius: 999px;
      background: rgba(255,255,255,.24);
      transform-origin: left;
      animation: type 2.2s ease-in-out infinite;
    }

    .line:nth-child(1) { width: 72%; background: var(--accent-2); }
    .line:nth-child(2) { width: 95%; animation-delay: .16s; }
    .line:nth-child(3) { width: 58%; background: var(--accent); animation-delay: .32s; }
    .line:nth-child(4) { width: 84%; animation-delay: .48s; }

    .cursor {
      width: 7px;
      height: 13px;
      margin-top: 1px;
      background: var(--accent);
      border-radius: 2px;
      animation: blink .7s steps(1) infinite;
    }

    .stand {
      position: absolute;
      top: 111px;
      left: 50%;
      width: 38px;
      height: 18px;
      transform: translateX(-50%);
      border-left: 3px solid rgba(255,255,255,.55);
      border-right: 3px solid rgba(255,255,255,.55);
    }

    .base {
      position: absolute;
      top: 128px;
      left: 50%;
      width: 78px;
      height: 3px;
      border-radius: 99px;
      transform: translateX(-50%);
      background: rgba(255,255,255,.55);
    }

    .gear {
      position: absolute;
      right: 4px;
      top: 54px;
      width: 44px;
      height: 44px;
      border: 5px dotted var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 24px rgba(185,255,102,.18);
      animation: spin 5s linear infinite;
    }

    .gear.small {
      left: 4px;
      right: auto;
      top: 82px;
      width: 30px;
      height: 30px;
      border-width: 4px;
      border-color: var(--accent-2);
      animation-direction: reverse;
      animation-duration: 3.6s;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 18px;
      padding: 8px 13px;
      border: 1px solid rgba(185,255,102,.18);
      border-radius: 999px;
      background: rgba(185,255,102,.055);
      color: #dfffba;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px var(--accent);
      animation: pulse 1.4s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4.5rem);
      line-height: .98;
      letter-spacing: -.055em;
      font-weight: 780;
    }

    h1 span {
      display: block;
      margin-top: 8px;
      background: linear-gradient(90deg, #ffffff 10%, var(--accent-2) 48%, var(--accent) 88%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      max-width: 550px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: clamp(.98rem, 2vw, 1.12rem);
      line-height: 1.75;
    }

    .footer {
      margin-top: 30px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      color: rgba(255,255,255,.42);
      font-size: 12px;
      letter-spacing: .08em;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 50% { transform: scale(.72); opacity: .45; } }
    @keyframes type {
      0%, 12% { transform: scaleX(.08); opacity: .4; }
      42%, 78% { transform: scaleX(1); opacity: 1; }
      100% { transform: scaleX(.08); opacity: .4; }
    }
    @keyframes drift {
      from { transform: translate3d(0,0,0) scale(1); }
      to { transform: translate3d(-34px,26px,0) scale(1.1); }
    }

    @media (max-width: 560px) {
      .wrap { padding: 40px 20px 30px; border-radius: 22px; }
      .animation { transform: scale(.88); margin-bottom: 15px; }
      p { line-height: 1.65; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="orb one"></div>
  <div class="orb two"></div>

  <main class="wrap">
    <div class="animation" aria-hidden="true">
      <div class="monitor">
        <div class="screen">
          <div class="code">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
            <span class="cursor"></span>
          </div>
        </div>
      </div>
      <div class="stand"></div>
      <div class="base"></div>
      <div class="gear"></div>
      <div class="gear small"></div>
    </div>

    <div class="status"><span class="dot"></span> Maintenance in progress</div>

    <h1>
      Portfolio is under
      <span>maintenance.</span>
    </h1>

    <p>
      I’m making a few upgrades behind the scenes. The portfolio will be back online soon — cleaner, faster, and better than before.
    </p>

    <div class="footer">DEEPANSHU GULIA · PORTFOLIO</div>
  </main>
</body>
</html>
